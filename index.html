<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Forge</title>
<meta name="description" content="Plan your D&D campaign: party, NPCs, locations, factions, quests, sessions, encounters, dice and generators.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3ead7; --surface: #fffaf0; --surface-2: #f8f0de; --line: #dccdae;
  --ink: #2b2118; --muted: #74624e; --accent: #8b1e1e; --accent-ink: #fff8ee;
  --gold: #a07a24; --ok: #2f6b3a; --warn: #a0661a; --bad: #9b2226; --info: #2c5a7a;
  --shadow: 0 1px 2px rgba(60,40,10,.08), 0 6px 20px rgba(60,40,10,.06);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15121a; --surface: #201c26; --surface-2: #29242f; --line: #3a3342;
    --ink: #ece4d4; --muted: #a89d8c; --accent: #d4574a; --accent-ink: #1a1014;
    --gold: #d9b35b; --ok: #6fbf7e; --warn: #e0a24d; --bad: #e0685f; --info: #6fa8d6;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15121a; --surface: #201c26; --surface-2: #29242f; --line: #3a3342;
  --ink: #ece4d4; --muted: #a89d8c; --accent: #d4574a; --accent-ink: #1a1014;
  --gold: #d9b35b; --ok: #6fbf7e; --warn: #e0a24d; --bad: #e0685f; --info: #6fa8d6;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
h1, h2, h3, .brand { font-family: Cinzel, Georgia, serif; letter-spacing: .02em; }
h1 { font-size: 1.5rem; margin: 0; }
h2 { font-size: 1.15rem; margin: 0 0 .6rem; }
h3 { font-size: 1rem; margin: 0 0 .4rem; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; font-size: 1.15rem; color: var(--accent); white-space: nowrap; text-decoration: none; }
.topbar select { max-width: 220px; }
.top-search { flex: 1; min-width: 0; max-width: 360px; margin-left: auto; }
.saved { font-size: .8rem; color: var(--muted); min-width: 52px; text-align: right; }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; }
.menu summary::-webkit-details-marker { display: none; }
.menu-list { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px; min-width: 220px; display: flex; flex-direction: column; z-index: 40; }
.menu-list button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.menu-list button:hover { background: var(--surface-2); }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }

/* Controls */
.input, select, textarea, input[type="text"], input[type="number"], input[type="date"], input[type="search"] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 0; border-color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 9px; font-size: .85rem; }
.icon-btn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }

/* Layout */
.layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 57px); }
.sidebar { border-right: 1px solid var(--line); padding: 14px 10px; background: var(--surface-2); position: sticky; top: 57px; height: calc(100vh - 57px); overflow-y: auto; }
.nav-group { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 10px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; }
.nav a:hover { background: var(--surface); }
.nav a.active { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
.nav .count { margin-left: auto; font-size: .78rem; color: var(--muted); }
.main { padding: 20px; min-width: 0; }
.menu-toggle { display: none; }

/* Lists and editor */
.split { display: grid; grid-template-columns: minmax(250px, 320px) 1fr; gap: 20px; align-items: start; }
.listpane { position: sticky; top: 77px; max-height: calc(100vh - 97px); display: flex; flex-direction: column; gap: 10px; }
.list-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.blurb { color: var(--muted); margin: 0; font-size: .9rem; }
.items { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.item { display: block; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--ink); }
.item:hover { border-color: var(--accent); }
.item.active { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.item-title { font-weight: 600; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.item-sub { display: block; font-size: .83rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: .7rem; font-weight: 600; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.tone-ok { color: var(--ok); } .tone-warn { color: var(--warn); } .tone-bad { color: var(--bad); } .tone-info { color: var(--info); } .tone-muted { color: var(--muted); } .tone-gold { color: var(--gold); }
.tagbar { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .78rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.empty { color: var(--muted); text-align: center; padding: 30px 12px; border: 1px dashed var(--line); border-radius: var(--radius); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.editor-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.kicker { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.spacer { flex: 1; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 4px; grid-column: 1 / -1; min-width: 0; }
.field.half { grid-column: span 1; }
.field > span { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field .help { font-weight: 400; }
.title-input { font-family: Cinzel, Georgia, serif; font-size: 1.35rem !important; font-weight: 700; }
.check { display: flex; align-items: center; gap: 8px; font-size: .9rem; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.hint { font-size: .82rem; color: var(--muted); margin-top: 14px; }
.hint code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.links { margin-top: 14px; display: grid; gap: 10px; }
.links .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.links .row > b { font-size: .8rem; color: var(--muted); margin-right: 4px; }
.link-chip { font-size: .82rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); text-decoration: none; color: var(--ink); }
.link-chip:hover { border-color: var(--accent); }
.link-chip.missing { border-style: dashed; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.link-chip.missing select { padding: 0 4px; font-size: .78rem; width: auto; border-radius: 6px; }

/* Encounter */
.mon-list { display: flex; flex-direction: column; gap: 6px; }
.mon-row { display: grid; grid-template-columns: 1fr 90px 70px auto; gap: 6px; }
.party-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 10px; }
.party-row label.inline { display: flex; align-items: center; gap: 6px; font-size: .9rem; }
.party-row label.inline input { width: 70px; }
.diff { margin-top: 12px; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); }
.diff-label { font-family: Cinzel, Georgia, serif; font-weight: 700; font-size: 1.2rem; }
.bar { position: relative; height: 10px; background: var(--line); border-radius: 999px; margin: 10px 0 4px; overflow: hidden; }
.bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: currentColor; }
.bar-tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface); }
.thresh { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); flex-wrap: wrap; gap: 6px; }

/* Overview */
.ov-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--ink); }
.stat:hover { border-color: var(--accent); }
.stat b { display: block; font-size: 1.5rem; font-family: Cinzel, Georgia, serif; }
.stat span { font-size: .8rem; color: var(--muted); }
.steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.steps a { display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.steps a:hover { background: var(--surface-2); }
.steps .mark { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .7rem; margin-top: 1px; }
.steps .done .mark { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.steps .done .step-text { color: var(--muted); text-decoration: line-through; }
.progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 6px 0 12px; }
.progress > div { height: 100%; background: var(--ok); }
.mini-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.stack { display: flex; flex-direction: column; gap: 20px; }

/* Tools */
.tools { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 20px; align-items: start; }
.dice-btns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
.dice-btns .btn { padding-left: 4px; padding-right: 4px; }
.dice-btns .wide { grid-column: span 2; }
.dice-btns .full { grid-column: 1 / -1; }
.roll-out { text-align: center; padding: 16px 8px; }
.roll-total { font-family: Cinzel, Georgia, serif; font-size: 3rem; font-weight: 700; line-height: 1; }
.roll-total.crit { color: var(--ok); } .roll-total.fumble { color: var(--bad); }
.roll-detail { color: var(--muted); font-size: .88rem; margin-top: 6px; word-break: break-word; }
.roll-detail s { opacity: .55; }
.history { list-style: none; padding: 0; margin: 0; font-size: .85rem; max-height: 220px; overflow-y: auto; }
.history li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); }
.gens { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.gen-out { margin: 10px 0; font-size: .9rem; min-height: 40px; }
.gen-out dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
.gen-out dt { color: var(--muted); font-size: .8rem; font-weight: 600; }
.gen-out dd { margin: 0; }
.gen-title { font-weight: 700; font-size: 1.02rem; margin-bottom: 6px; }
.gen-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.gen-head h2 { margin: 0; }
.gen-culture { display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); }
.gen-culture select { width: auto; }
.gen-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.gen-card-head h3 { margin: 0; }
.gen-opt { width: auto; padding: 4px 8px; font-size: .85rem; }
.gen-wide { grid-column: 1 / -1; }
.gen-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.gen-sec { margin-top: 10px; }
.gen-sec ol { margin: 4px 0 0; padding-left: 20px; }
.gen-sec li { margin: 3px 0; }

/* Codex */
.cx-head { margin-bottom: 12px; }
.cx-bar { display: flex; flex-direction: column; gap: 10px; }
.cx-tools { display: flex; gap: 8px; max-width: 640px; }
.cx-count { opacity: .65; font-size: .72rem; margin-left: 2px; }
.cx-grid { columns: 380px; column-gap: 16px; }
.cx-card { break-inside: avoid; margin-bottom: 16px; display: block; }
.cx-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.cx-trads { display: flex; gap: 4px; flex-wrap: wrap; }
.cx-name { font-size: 1.15rem; margin: 8px 0 2px; }
.cx-src { font-size: .8rem; color: var(--muted); font-style: italic; margin-bottom: 10px; }
.cx-dl { margin: 0 0 12px; display: grid; gap: 2px; font-size: .9rem; }
.cx-dl dt { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-top: 8px; }
.cx-dl dd { margin: 0; }
.cx-drawn-wrap { max-width: 760px; margin-bottom: 20px; }
.cx-drawn { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--gold), var(--shadow); }

/* Welcome */
.welcome { max-width: 640px; margin: 8vh auto; text-align: center; }
.welcome h1 { font-size: 2.2rem; color: var(--accent); }
.welcome p { color: var(--muted); font-size: 1.05rem; }
.welcome .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 100; box-shadow: var(--shadow); }
.only-narrow { display: none !important; }

@media (max-width: 1100px) {
  .ov-grid, .tools { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .menu-toggle { display: inline-block; }
  .sidebar { position: fixed; top: 57px; left: 0; width: 250px; z-index: 25; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  body.nav-open .sidebar { transform: none; }
  .main { padding: 16px; }
  .split { grid-template-columns: 1fr; }
  .listpane { position: static; max-height: none; }
  .split.has-sel .listpane { display: none; }
  .split:not(.has-sel) .editorpane { display: none; }
  .only-narrow { display: inline-flex !important; }
  .topbar { gap: 8px; padding: 10px 12px; }
  .top-search { max-width: none; min-width: 90px; }
  .topbar select { max-width: 120px; }
  .saved { display: none; }
  .brand-text { display: none; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .cx-grid { columns: 1; }
  .cx-tools { flex-direction: column; }
  .form { grid-template-columns: 1fr; }
  .field.half { grid-column: 1 / -1; }
  .mon-row { grid-template-columns: 1fr 76px 60px auto; }
}
</style>
</head>
<body>
<header class="topbar">
  <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
  <a class="brand" href="#/overview">⚔<span class="brand-text"> Campaign Forge</span></a>
  <select id="campaignSelect" aria-label="Campaign"></select>
  <input type="search" class="top-search" id="globalSearch" placeholder="Search everything…" aria-label="Search">
  <span class="saved" id="saved"></span>
  <details class="menu" id="menu">
    <summary class="icon-btn" aria-label="More">⋯</summary>
    <div class="menu-list">
      <button data-menu="new">＋ New campaign</button>
      <button data-menu="sample">✦ Add sample campaign</button>
      <hr>
      <button data-menu="exportJson">⭳ Export campaign (JSON backup)</button>
      <button data-menu="exportMd">⭳ Export as Markdown document</button>
      <button data-menu="import">⭱ Import campaign (JSON)</button>
      <hr>
      <button data-menu="theme">◐ Toggle light / dark</button>
      <button data-menu="delete" style="color:var(--bad)">✕ Delete this campaign</button>
    </div>
  </details>
</header>
<div class="layout">
  <nav class="sidebar nav" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="codex.js"></script>
<script src="generators.js"></script>
<script>
'use strict';
/* =========================================================
   Helpers
   ========================================================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const main = $('#main');
// Only touch the DOM when markup changed, so a blur-triggered refresh never swaps out an element mid-click.
function setHTML(el, html) { if (el && el.innerHTML !== html && el._html !== html) { el.innerHTML = html; el._html = html; } }

/* =========================================================
   Entity types
   ========================================================= */
const ATT_TONE = { Friendly: 'ok', Ally: 'ok', Neutral: 'muted', Wary: 'warn', Rival: 'warn', Hostile: 'bad', Enemy: 'bad' };
const TYPES = {
  pcs: {
    label: 'Party', one: 'Character', icon: '🛡️', group: 'world',
    blurb: 'The heroes. Their backstories are your best source of plot hooks.',
    fields: [
      { k: 'name', l: 'Character name', t: 'text' },
      { k: 'player', l: 'Player', t: 'text', half: 1 },
      { k: 'level', l: 'Level', t: 'number', half: 1, min: 1, max: 20 },
      { k: 'race', l: 'Species / race', t: 'text', half: 1 },
      { k: 'cls', l: 'Class', t: 'text', half: 1 },
      { k: 'background', l: 'Background', t: 'text' },
      { k: 'hooks', l: 'Backstory hooks', t: 'textarea', ph: 'Unresolved threads from their past you can weave into the story…' },
      { k: 'goals', l: 'Personal goals', t: 'textarea' },
      { k: 'notes', l: 'Notes', t: 'textarea' },
      { k: 'tags', l: 'Tags', t: 'tags' }],
    defaults: () => ({ level: 1 }),
    sub: e => [e.race, e.cls, e.player && `played by ${e.player}`].filter(Boolean).join(' · '),
    badge: e => e.level ? { text: `Lv ${e.level}`, tone: 'gold' } : null,
  },
  npcs: {
    label: 'NPCs', one: 'NPC', icon: '🎭', group: 'world',
    blurb: 'Allies, villains and everyone in between. Give each one a want and a secret.',
    fields: [
      { k: 'name', l: 'Name', t: 'text' },
      { k: 'role', l: 'Role / occupation', t: 'text', half: 1 },
      { k: 'race', l: 'Species / race', t: 'text', half: 1 },
      { k: 'location', l: 'Found at', t: 'text', half: 1, ref: 1, ph: 'A location name' },
      { k: 'faction', l: 'Faction', t: 'text', half: 1, ref: 1 },
      { k: 'attitude', l: 'Attitude to party', t: 'select', half: 1, opts: ['Friendly', 'Neutral', 'Wary', 'Hostile'] },
      { k: 'status', l: 'Status', t: 'select', half: 1, opts: ['Alive', 'Dead', 'Missing', 'Unknown'] },
      { k: 'appearance', l: 'Appearance', t: 'textarea', rows: 2 },
      { k: 'personality', l: 'Personality, voice & mannerisms', t: 'textarea', rows: 2 },
      { k: 'motivation', l: 'What do they want?', t: 'textarea', rows: 2 },
      { k: 'secret', l: 'Secret', t: 'textarea', rows: 2 },
      { k: 'notes', l: 'Notes', t: 'textarea' },
      { k: 'tags', l: 'Tags', t: 'tags' }],
    defaults: () => ({ attitude: 'Neutral', status: 'Alive' }),
    sub: e => [e.role, e.location].filter(Boolean).join(' · '),
    badge: e => e.status && e.status !== 'Alive' ? { text: e.status, tone: 'muted' } : e.attitude ? { text: e.attitude, tone: ATT_TONE[e.attitude] } : null,
  },
  locations: {
    label: 'Locations', one: 'Location', icon: '🏰', group: 'world',
    blurb: 'Towns, dungeons, wilds and planes. Describe them with all five senses.',
    fields: [
      { k: 'name', l: 'Name', t: 'text' },

/* =========================================================
   Encounter math (D&D 5e DMG)
   ========================================================= */
const THRESH = { 1: [25, 50, 75, 100], 2: [50, 100, 150, 200], 3: [75, 150, 225, 400], 4: [125, 250, 375, 500], 5: [250, 500, 750, 1100], 6: [300, 600, 900, 1400], 7: [350, 750, 1100, 1700], 8: [450, 900, 1400, 2100], 9: [550, 1100, 1600, 2400], 10: [600, 1200, 1900, 2800], 11: [800, 1600, 2400, 3600], 12: [1000, 2000, 3000, 4500], 13: [1100, 2200, 3400, 5100], 14: [1250, 2500, 3800, 5700], 15: [1400, 2800, 4300, 6400], 16: [1600, 3200, 4800, 7200], 17: [2000, 3900, 5900, 8800], 18: [2100, 4200, 6300, 9500], 19: [2400, 4900, 7300, 10900], 20: [2800, 5700, 8500, 12700] };
const CR_XP = { '0': 10, '1/8': 25, '1/4': 50, '1/2': 100, '1': 200, '2': 450, '3': 700, '4': 1100, '5': 1800, '6': 2300, '7': 2900, '8': 3900, '9': 5000, '10': 5900, '11': 7200, '12': 8400, '13': 10000, '14': 11500, '15': 13000, '16': 15000, '17': 18000, '18': 20000, '19': 22000, '20': 25000, '21': 33000, '22': 41000, '23': 50000, '24': 62000, '25': 75000, '26': 90000, '27': 105000, '28': 120000, '29': 135000, '30': 155000 };
const CRS = Object.keys(CR_XP);
const MULTS = [0.5, 1, 1.5, 2, 2.5, 3, 4, 5];
const clampLvl = l => Math.min(20, Math.max(1, Math.round(+l || 1)));

function encCalc(c, e) {
  const pcs = c ? c.entities.pcs : [];
  const levels = e.useParty && pcs.length
    ? pcs.map(p => clampLvl(p.level))
    : Array(Math.max(1, Math.min(12, Math.round(+e.partySize || 4)))).fill(clampLvl(e.partyLevel));
  const t = [0, 0, 0, 0];
  levels.forEach(l => THRESH[l].forEach((v, i) => t[i] += v));
  let xp = 0, n = 0;
  (e.monsters || []).forEach(m => { const k = Math.max(0, Math.round(+m.count || 0)); xp += (CR_XP[m.cr] || 0) * k; n += k; });
  let idx = n <= 1 ? 1 : n === 2 ? 2 : n <= 6 ? 3 : n <= 10 ? 4 : n <= 14 ? 5 : 6;
  if (levels.length < 3) idx++;
  else if (levels.length >= 6) idx--;
  const mult = n ? MULTS[Math.max(0, Math.min(7, idx))] : 1;
  const adj = Math.round(xp * mult);
  let label = 'Trivial', tone = 'muted';
  if (adj >= t[3]) { label = 'Deadly'; tone = 'bad'; }
  else if (adj >= t[2]) { label = 'Hard'; tone = 'warn'; }
  else if (adj >= t[1]) { label = 'Medium'; tone = 'info'; }
  else if (adj >= t[0]) { label = 'Easy'; tone = 'ok'; }
  return { levels, t, xp, n, mult, adj, label, tone, perPC: Math.round(xp / levels.length) };
}

/* =========================================================
   Storage
   ========================================================= */
const KEY = 'campaign-forge-v1';
let db;
function load() {
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch { db = null; }
  if (!db || !Array.isArray(db.campaigns)) db = { campaigns: [], currentId: null, theme: null };
  db.campaigns.forEach(ensure);
  if (!db.campaigns.some(c => c.id === db.currentId)) db.currentId = db.campaigns[0]?.id ?? null;
}
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  $('#saved').textContent = 'Saving…';
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(db)); $('#saved').textContent = 'Saved ✓'; }
    catch { $('#saved').textContent = 'Not saved'; toast('Could not save — browser storage is full or blocked. Export a backup!'); }
  }, 300);
}
function ensure(c) {
  c.id ||= uid(); c.name ||= 'Untitled campaign'; c.overview ||= {}; c.entities ||= {};
  for (const k in TYPES) if (!Array.isArray(c.entities[k])) c.entities[k] = [];
  return c;
}
const camp = () => db.campaigns.find(c => c.id === db.currentId);
function touch(c) { c.updated = Date.now(); save(); }
function addCampaign(c) { ensure(c); db.campaigns.push(c); db.currentId = c.id; save(); return c; }

let view = { section: 'overview', sel: null, filter: '', tag: null, q: '', cx: { cat: 'premise', trad: '', q: '', drawn: null } };
function go(section, id) { location.hash = `#/${section}${id ? '/' + id : ''}`; }
function parseHash() {
  const [, section = 'overview', id = null] = location.hash.split('/');
  const sec = SECTION_ORDER.includes(section) || section === 'search' ? section : 'overview';
  if (sec !== view.section) { view.filter = ''; view.tag = null; }

}

function renderTop() {

    + '<div class="nav-group">World & story</div>' + typeLinks('world')

function fieldHTML(f, obj, scope) {

function allEntities(c) { return Object.entries(c.entities).flatMap(([type, arr]) => arr.map(e => ({ type, e }))); }
function findByName(c, name) { const n = name.trim().toLowerCase(); return allEntities(c).find(x => (x.e.name || '').trim().toLowerCase() === n); }
function mentionsOf(type, e) {
  const out = new Set();
  for (const f of TYPES[type].fields) {
    const v = e[f.k];
    if (typeof v !== 'string') continue;
    if (f.t === 'textarea') for (const m of v.matchAll(/\[\[([^\]]+)\]\]/g)) out.add(m[1].trim());
    else if (f.ref && v.trim()) out.add(v.trim());

}
function renderLinks(c, type, e) {

  const mentions = mentionsOf(type, e).filter(n => n.toLowerCase() !== (e.name || '').toLowerCase());
  const found = [], missing = [];
  mentions.forEach(n => { const x = findByName(c, n); x ? found.push(x) : missing.push(n); });

/* =========================================================
   Dice
   ========================================================= */
const rollHistory = [];
let lastRoll = null;
function rollDice(expr) {
  const s = expr.replace(/\s+/g, '').toLowerCase();
  const terms = s.match(/[+-]?[^+-]+/g);
  if (!s || !terms || terms.join('') !== s) throw new Error('bad');
  let total = 0; const parts = [];
  for (const term of terms) {
    const sign = term[0] === '-' ? -1 : 1, body = term.replace(/^[+-]/, '');
    const m = body.match(/^(\d*)d(\d+|%)(?:(kh|kl)(\d+))?$/);
    if (m) {
      const n = +(m[1] || 1), sides = m[2] === '%' ? 100 : +m[2];
      if (n < 1 || n > 200 || sides < 2 || sides > 1000) throw new Error('range');
      const rolls = Array.from({ length: n }, () => ({ v: 1 + Math.floor(Math.random() * sides), keep: true }));
      if (m[3]) { const k = Math.min(+m[4], n); [...rolls].sort((a, b) => m[3] === 'kh' ? b.v - a.v : a.v - b.v).forEach((r, i) => r.keep = i < k); }
      total += sign * rolls.filter(r => r.keep).reduce((a, r) => a + r.v, 0);
      parts.push({ sign, body, rolls, sides });
    } else if (/^\d+$/.test(body)) { total += sign * +body; parts.push({ sign, body, flat: +body }); }
    else throw new Error('bad');
  }
  return { expr: s, total, parts };
}
function doRoll(expr) {
  try { lastRoll = rollDice(expr); } catch { toast('Try something like 2d6+3, d20, 4d6kh3 or 2d20kl1'); return; }
  rollHistory.unshift(lastRoll); rollHistory.length = Math.min(rollHistory.length, 30);
  renderDice();
}
function rollDetail(r) {
  return r.parts.map((p, i) => (i || p.sign < 0 ? (p.sign < 0 ? ' − ' : ' + ') : '') + (p.flat != null ? p.flat
    : `${p.body} [${p.rolls.map(x => x.keep ? x.v : `<s>${x.v}</s>`).join(', ')}]`)).join('');
}
function renderDice() {
  const out = $('#rollOut'); if (!out) return;
  if (lastRoll) {
    const d20 = lastRoll.parts.filter(p => p.sides === 20);
    const nat = d20.length === 1 ? d20[0].rolls.filter(r => r.keep) : [];
    const cls = nat.length === 1 ? (nat[0].v === 20 ? 'crit' : nat[0].v === 1 ? 'fumble' : '') : '';
    out.innerHTML = `<div class="roll-total ${cls}">${lastRoll.total}</div><div class="roll-detail">${esc(lastRoll.expr)} → ${rollDetail(lastRoll)}${cls === 'crit' ? ' · Natural 20!' : cls === 'fumble' ? ' · Natural 1…' : ''}</div>`;
  }
  $('#history').innerHTML = rollHistory.slice(1).map(r => `<li><span>${esc(r.expr)}</span><b>${r.total}</b></li>`).join('');
}
function rollStats() {
  const sets = Array.from({ length: 6 }, () => rollDice('4d6kh3').total).sort((a, b) => b - a);
  lastRoll = { expr: 'ability scores (4d6 drop lowest ×6)', total: sets.join(' · '), parts: [] };
  rollHistory.unshift(lastRoll);
  const out = $('#rollOut');
  out.innerHTML = `<div class="roll-total" style="font-size:1.8rem">${sets.join(' · ')}</div><div class="roll-detail">Ability scores — total ${sets.reduce((a, b) => a + b, 0)}, modifiers ${sets.map(s => { const m = Math.floor((s - 10) / 2); return m >= 0 ? '+' + m : m; }).join(' ')}</div>`;
  $('#history').innerHTML = rollHistory.slice(1).map(r => `<li><span>${esc(r.expr)}</span><b>${r.total}</b></li>`).join('');
}

const CX = window.CODEX || { traditions: {}, categories: {}, entries: [] };
const cxRecent = [];

// Random pick that avoids repeating anything drawn recently.
function drawCodex(cat, trad = '') {
  const pool = cxFiltered(cat, trad);
  if (!pool.length) return null;
  const fresh = pool.filter(e => !cxRecent.includes(e));
  const e = pick(fresh.length ? fresh : pool);
  cxRecent.push(e); if (cxRecent.length > Math.min(12, pool.length - 1)) cxRecent.shift();
  return e;
}

    case 'villain': type = 'npcs'; data = { role: e.role, attitude: 'Hostile', status: 'Alive', motivation: e.worldview, personality: `First sign: ${e.tell}`, secret: e.flaw, notes: `What they get right: ${e.truth}\n\nRedemption: ${e.redemption}\n\n${src}`, tags: [...tags, 'villain'] }; break;
    case 'monster': type = 'encounters'; data = { kind: 'Combat', monsters: structuredClone(e.monsters || []), setup: e.lair, tactics: e.tactics, notes: `${e.lore}\n\nWhat it embodies: ${e.meaning}\n\n5e stats: ${e.stats}\n\nAnother way: ${e.mercy}\n\n${src}` }; break;
    case 'god': type = 'npcs'; data = { role: `Deity: ${e.domain}`, attitude: 'Neutral', status: 'Alive', motivation: e.wants, personality: `Omen: ${e.omen}`, secret: `Price: ${e.price}`, notes: `Boon: ${e.boon}\n\nCleric domains: ${e.domains}\n\n${src}`, tags: [...tags, 'god'] }; break;
    case 'sage': type = 'npcs'; data = { role: e.role, attitude: 'Friendly', status: 'Alive', personality: `Teaching: ${e.teaching}`, motivation: `Test: ${e.test}`, secret: e.flaw, notes: `Gift: ${e.gift}\n\n${src}`, tags: [...tags, 'mentor'] }; break;
    case 'dilemma': type = 'encounters'; data = { kind: 'Social', monsters: [], setup: e.situation, tactics: `Stakes: ${e.stakes}`, notes: `Lenses: ${e.lenses}\n\nOutcomes: ${e.outcomes}\n\n${src}` }; break;
    case 'riddle': type = 'encounters'; data = { kind: 'Trap / Puzzle', monsters: [], setup: `${e.setup}\n\nThe question: ${e.riddle}`, tactics: `Answers: ${e.answers}`, notes: `Outcome: ${e.outcome}\n\n${src}` }; break;
    case 'hook': type = 'quests'; data = { kind: 'Main', status: 'Idea', hook: e.hook, objectives: `The truth: ${e.truth}`, complications: e.twist, reward: e.reward, notes: src }; break;
    case 'relic': type = 'items'; data = { rarity: e.rarity, kind: e.kind || 'Wondrous item', attune: !!e.attune, description: e.power, notes: `${e.lore}\n\nPrice: ${e.price}\n\n${src}` }; break;
  }
  data.name = e.name; data.tags ||= tags;
  const made = createEntity(type, data);
  renderNav(); toast(`Added “${made.name}” to ${TYPES[type].label}`);
}

/* =========================================================
   Actions
   ========================================================= */
function currentEnt() { const c = camp(); return TYPES[view.section] ? c.entities[view.section].find(e => e.id === view.sel) : null; }
function createEntity(type, data = {}) {
  const c = camp(), T = TYPES[type];
  const e = { id: uid(), ...T.defaults?.(c), ...data };
  if (!e.name) e.name = T.newName ? T.newName(e) : `New ${T.one.toLowerCase()}`;
  c.entities[type].push(e); touch(c);
  return e;
}
function newCampaignPrompt() {
  const name = prompt('Name your campaign:', 'My new campaign');
  if (name === null) return;
  addCampaign({ id: uid(), name: name.trim() || 'Untitled campaign', created: Date.now() });
  go('overview'); render();
}
function download(filename, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const slug = s => (s || 'campaign').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function toMarkdown(c) {
  const val = (f, v) => f.t === 'tags' ? (v || []).map(t => '#' + t).join(' ') : f.t === 'checkbox' ? (v ? 'Yes' : '') : String(v ?? '').trim();
  let md = `# ${c.name}\n\n`;
  for (const f of OV_FIELDS) { const v = val(f, c.overview[f.k]); if (v) md += `**${f.l}:** ${v.includes('\n') ? '\n\n' + v : v}\n\n`; }
  for (const [k, T] of Object.entries(TYPES)) {
    const list = [...c.entities[k]].sort(T.sort || ((a, b) => (a.name || '').localeCompare(b.name || '')));
    if (!list.length) continue;
    md += `\n## ${T.label}\n\n`;
    for (const e of list) {
      md += `### ${e.name || 'Untitled'}\n\n`;
      for (const f of T.fields.slice(1)) {
        if (f.t === 'monsters') {
          if ((e.monsters || []).length) { const r = encCalc(c, e); md += `**Monsters** (${r.label}, ${r.adj} adjusted XP):\n\n${e.monsters.map(m => `- ${m.count}× ${m.name || 'Monster'} (CR ${m.cr})`).join('\n')}\n\n`; }
          continue;
        }
        const v = val(f, e[f.k]);
        if (v) md += f.t === 'textarea' ? `**${f.l}:**\n\n${v}\n\n` : `**${f.l}:** ${v}\n\n`;
      }
    }
  }
  return md.replace(/\[\[([^\]]+)\]\]/g, '$1');
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act],[data-roll],[data-gen],[data-gensave],[data-menu]');
  if (!t) {
    if (!ev.target.closest('#menu')) $('#menu').open = false;
    if (!ev.target.closest('#sidebar,#menuToggle')) document.body.classList.remove('nav-open');
    return;
  }
  const c = camp();
  if (t.dataset.roll) return doRoll(t.dataset.roll);
  if (t.dataset.gen) {
    const k = t.dataset.gen; genResults[k] = GENS[k].make(genContext(k));
    $(`#gen-${k}`).innerHTML = genHTML(k);
    $(`#genb-${k}`).innerHTML = genButtons(k);
    return;
  }
  if (t.dataset.gensave) {
    const sv = genResults[t.dataset.gensave]?.saves?.[+t.dataset.si]; if (!sv || !c) return;
    const made = sv.items.map(it => ({ type: it.type, e: createEntity(it.type, structuredClone(it.data)) }));
    renderNav();
    toast(made.length === 1 ? `Added “${made[0].e.name}” to ${TYPES[made[0].type].label}` : `Added ${made.length} records: ${[...new Set(made.map(m => TYPES[m.type].label))].join(', ')}`);
    t.disabled = true; t.textContent = '✓ Saved';
    return;
  }
  if (t.dataset.menu) {
    $('#menu').open = false;
    const m = t.dataset.menu;
    if (m === 'new') newCampaignPrompt();
    else if (m === 'sample') { addCampaign(sampleCampaign()); go('overview'); render(); toast('Sample campaign added'); }
    else if (m === 'import') $('#importFile').click();
    else if (m === 'theme') { const dark = getComputedStyle(document.documentElement).colorScheme === 'dark'; db.theme = dark ? 'light' : 'dark'; save(); applyTheme(); }
    else if (!c) toast('Create a campaign first');
    else if (m === 'exportJson') download(`${slug(c.name)}.json`, JSON.stringify(c, null, 2), 'application/json');
    else if (m === 'exportMd') download(`${slug(c.name)}.md`, toMarkdown(c), 'text/markdown');
    else if (m === 'delete') {
      if (!confirm(`Delete “${c.name}” and everything in it? This cannot be undone.\n\nTip: export a JSON backup first.`)) return;
      db.campaigns = db.campaigns.filter(x => x.id !== c.id); db.currentId = db.campaigns[0]?.id ?? null; save(); go('overview'); render();
    }
    return;
  }
  const act = t.dataset.act;
  if (t.tagName === 'SELECT') return; // selects act on change
  switch (act) {
    case 'newCamp': return newCampaignPrompt();
    case 'sample': addCampaign(sampleCampaign()); go('overview'); return render();
    case 'import': return $('#importFile').click();
    case 'add': { const e = createEntity(view.section); return go(view.section, e.id); }
    case 'addType': { const e = createEntity(t.dataset.type); return go(t.dataset.type, e.id); }
    case 'dup': {
      const e = currentEnt(); if (!e) return;
      const copy = { ...structuredClone(e), id: uid(), name: `${e.name} (copy)` };
      c.entities[view.section].push(copy); touch(c); return go(view.section, copy.id);
    }
    case 'del': {
      const e = currentEnt(); if (!e || !confirm(`Delete “${e.name}”?`)) return;
      c.entities[view.section] = c.entities[view.section].filter(x => x.id !== e.id); touch(c); return go(view.section);
    }
    case 'tag': view.tag = view.tag === t.dataset.tag ? null : t.dataset.tag; return renderList(c, view.section);
    case 'addMonster': { const e = currentEnt(); e.monsters.push({ name: '', cr: '1', count: 1 }); touch(c); renderEditor(c, 'encounters', e); renderList(c, 'encounters'); document.querySelector(`[data-m="name"][data-i="${e.monsters.length - 1}"]`)?.focus(); return; }
    case 'delMonster': { const e = currentEnt(); e.monsters.splice(+t.dataset.i, 1); touch(c); renderEditor(c, 'encounters', e); return renderList(c, 'encounters'); }
    case 'stats': return rollStats();
    case 'inspire': {
      const e = drawCodex('premise');
      if (!confirm(`${e.name}\n\n${e.pitch}\n\nCentral question: ${e.question}\n\nUse this premise for your campaign? It fills in the pitch, themes, tone and villain (your notes are kept).`)) return;
      applyPremise(c, e); return renderOverview(c);
    }
    case 'cxCat': view.cx.cat = t.dataset.cat; view.cx.drawn = null; return renderCodex(c);
    case 'cxTrad': view.cx.trad = view.cx.trad === t.dataset.trad ? '' : t.dataset.trad; view.cx.drawn = null; return renderCodex(c);
    case 'cxDraw': {
      if (t.dataset.cat) view.cx.cat = t.dataset.cat;
      const e = drawCodex(view.cx.cat, view.cx.trad);
      view.cx.drawn = e ? CX.entries.indexOf(e) : null;
      if (view.section !== 'codex') return go('codex');
      renderCodex(c); return window.scrollTo(0, 0);
    }
    case 'cxSave': return saveCodex(c, CX.entries[+t.dataset.i]);
    case 'mkVillain': { const e = createEntity('npcs', { name: c.overview.villain.trim(), attitude: 'Hostile', motivation: c.overview.villainGoal || '', tags: ['villain'] }); return go('npcs', e.id); }
  }
});

main.addEventListener('input', ev => {
  const t = ev.target, c = camp(); if (!c) return;
  if (t.id === 'listSearch') { view.filter = t.value; return renderList(c, view.section); }
  if (t.id === 'cxSearch') { view.cx.q = t.value; view.cx.drawn = null; return renderCodexCards(); }
  if (t.tagName === 'TEXTAREA') autosize(t);
  if (t.dataset.ov) {
    if (t.dataset.ov === '__name') { c.name = t.value; renderTop(); }
    else c.overview[t.dataset.ov] = t.type === 'number' ? (t.value === '' ? '' : +t.value) : t.value;
    return touch(c);
  }
  const e = currentEnt(); if (!e) return;
  if (t.dataset.f) {
    const k = t.dataset.f;
    e[k] = t.type === 'checkbox' ? t.checked : t.type === 'number' ? (t.value === '' ? '' : +t.value) : t.dataset.tags ? t.value.split(',').map(s => s.trim()).filter(Boolean) : t.value;
    touch(c);
    if (view.section === 'encounters') renderEncCalc(c, e);
    if (k !== 'tags') renderList(c, view.section);
  } else if (t.dataset.m) {
    const m = e.monsters[+t.dataset.i];
    m[t.dataset.m] = t.dataset.m === 'count' ? Math.max(0, +t.value || 0) : t.value;
    touch(c); renderEncCalc(c, e); renderList(c, view.section);
  }
});
main.addEventListener('change', ev => {
  const t = ev.target, c = camp(); if (!c) return;
  if (t.id === 'genCulture') { genCulture = t.value; return; }
  if (t.dataset.genopt) { genOpts[t.dataset.genopt] = t.value; return; }
  if (t.dataset.act === 'createMention' && t.value) {
    const type = t.value, name = t.dataset.name;
    const e = createEntity(type, { name });
    toast(`Created ${TYPES[type].one} “${name}”`);
    return go(type, e.id);
  }
  if (t.dataset.ov) return renderOverviewSide(c);
  const e = currentEnt();
  if (e) { renderLinks(c, view.section, e); if (t.dataset.tags) renderList(c, view.section); renderNav(); }
});
main.addEventListener('submit', ev => {
  if (ev.target.id === 'rollForm') { ev.preventDefault(); const v = $('#rollExpr').value; if (v.trim()) doRoll(v); }
});

$('#campaignSelect').addEventListener('change', ev => { db.currentId = ev.target.value; save(); view.filter = ''; view.tag = null; go('overview'); render(); });
$('#globalSearch').addEventListener('input', ev => {
  view.q = ev.target.value;
  if (!camp()) return;
  if (view.section !== 'search') go('search'); else renderSearch(camp());
});
$('#menuToggle').addEventListener('click', () => document.body.classList.toggle('nav-open'));
$('#importFile').addEventListener('change', async ev => {
  const file = ev.target.files[0]; ev.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data.campaigns) ? data.campaigns : [data];
    if (!list.every(x => x && typeof x === 'object' && (x.entities || x.overview))) throw new Error('not a campaign');
    list.forEach(x => { x.id = uid(); addCampaign(x); });
    go('overview'); render(); toast(`Imported ${list.length} campaign${list.length > 1 ? 's' : ''}`);
  } catch { toast('That file isn’t a Campaign Forge backup.'); }
});

/* =========================================================
   Misc UI
   ========================================================= */
function autosize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight + 2, 600) + 'px'; }
function autosizeAll() { main.querySelectorAll('textarea').forEach(autosize); }
function fmtDate(d) { const dt = new Date(d + 'T00:00:00'); return isNaN(dt) ? d : dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
let toastTimer;
function toast(msg) {
  let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 3000);
}
function applyTheme() { if (db.theme) document.documentElement.dataset.theme = db.theme; else delete document.documentElement.dataset.theme; }
